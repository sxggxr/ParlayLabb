<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ParlayLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Layout: one phone-width column of glass cards over soft blurred shapes, with a floating tab bar. Single dark look by design. */
  --bg:#060807; --ink:#f3f6f4; --mute:#a2aaa5; --dim:#707873;
  --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.05);
  --green:#5ce28f; --green-bg:rgba(92,226,143,.15); --green-line:rgba(92,226,143,.38); --green-ink:#03210f;
  --red:#ff7a7a; --panel:#0f1311;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3,p,dl,dd,dt{margin:0}
.num{font-variant-numeric:tabular-nums}

/* background shapes */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;display:block;border-radius:64px;filter:blur(14px)}
.b1{left:-130px;top:22%;width:260px;height:340px;background:linear-gradient(160deg,#3a3f3d,#111413);opacity:.7;transform:rotate(-8deg)}
.b2{right:-150px;top:16%;width:260px;height:420px;background:linear-gradient(200deg,#2b302e,#0b0d0c);opacity:.7;transform:rotate(6deg)}
.b3{right:-130px;bottom:6%;width:240px;height:300px;background:linear-gradient(200deg,rgba(92,226,143,.55),rgba(20,60,35,.2));opacity:.5;transform:rotate(-6deg)}
.b4{left:-70px;top:-50px;width:240px;height:280px;background:radial-gradient(circle,rgba(92,226,143,.34),transparent 70%);filter:blur(30px)}

.app{position:relative;z-index:1;max-width:430px;margin:0 auto;padding-bottom:128px}
.app.auth{padding-bottom:24px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
h1{font-size:clamp(40px,13vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.sub{color:var(--mute);font-size:16px;margin:14px 0 22px;text-wrap:balance}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--mute)}
.round svg{width:24px;height:24px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.card{
  position:relative;border-radius:30px;padding:20px 16px 16px;margin-bottom:18px;border:1px solid var(--line);
  background:radial-gradient(120% 80% at 100% 0%,rgba(92,226,143,.20),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;padding-inline:4px}
h2{font-size:clamp(26px,8vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.pill{background:var(--green-bg);border:1px solid var(--green-line);color:var(--green);font-weight:600;font-size:16px;padding:6px 14px;border-radius:999px;white-space:nowrap}

.legs{display:flex;flex-direction:column;gap:10px}
.leg{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:11px 14px 16px 12px;border-radius:22px;background:rgba(255,255,255,.055);border:1px solid var(--line)}
.leg:hover{background:rgba(255,255,255,.08)}
.sico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--green-bg);border:1px solid var(--green-line);color:var(--green)}
.sico svg{width:26px;height:26px}
.lt{font-size:clamp(18px,5.4vw,22px);font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere;min-width:0}
.lo{font-size:clamp(18px,5.4vw,22px);font-weight:600;color:var(--green);font-variant-numeric:tabular-nums}
.dots{position:absolute;right:14px;bottom:5px;color:var(--dim);font-size:11px;letter-spacing:2px;line-height:1}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:14px;border-radius:22px;border:1.5px dashed var(--green-line);color:var(--green);font-weight:600;font-size:20px}
.add svg{width:22px;height:22px}
.add:hover{background:var(--green-bg)}
.hint{color:var(--mute);font-size:14px;padding:10px 6px 0}

.lbl{display:block;color:var(--mute);font-size:17px;margin:14px 4px 8px;font-weight:500}
.field{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:0 18px;height:54px}
.field:focus-within{border-color:var(--green-line);box-shadow:0 0 0 3px var(--green-bg)}
.field .pre{color:var(--mute);font-size:22px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid var(--line);margin:18px 4px}
.res{display:grid;gap:12px;padding-inline:4px}
.res div{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.res dt{color:var(--mute);font-size:18px}
.res dd{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.res .big{font-size:32px;font-weight:700;color:var(--green)}
.cta{display:block;width:100%;margin-top:20px;height:60px;border-radius:999px;background:linear-gradient(180deg,#68ec9a,#3fcf78);color:var(--green-ink);font-weight:700;font-size:24px;text-align:center;box-shadow:0 6px 28px rgba(92,226,143,.28)}
.cta:active{transform:scale(.985)}
.foot{color:var(--mute);font-size:13px;text-align:center;margin:-4px 8px 14px;text-wrap:balance}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(92,226,143,.55)}100%{box-shadow:0 0 0 18px rgba(92,226,143,0)}}
.card.flash{animation:flash .7s ease-out}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-top:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-radius:32px;background:rgba(18,22,20,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--green-line);box-shadow:0 0 40px rgba(92,226,143,.1),inset 0 1px 0 rgba(255,255,255,.08)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;border-radius:24px;color:var(--mute);font-size:13px;font-weight:500;text-align:center}
.tab svg{width:30px;height:30px}
.tab.on{color:var(--green);background:var(--green-bg)}

/* list screens */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:4px}
.stat span{display:block;color:var(--mute);font-size:13px}
.stat b{display:block;font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--green)} .neg{color:var(--red)}
.item{padding:16px;margin-bottom:12px}
.item-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.item-h b{font-size:19px;font-weight:700}
.item-h .o{color:var(--green);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.item-d{color:var(--mute);font-size:13px;margin-top:2px}
.item ul{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px;color:var(--ink)}
.item li{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.05)}
.item li span:last-child{color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.money{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--mute);flex-wrap:wrap}
.money b{color:var(--ink);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sm{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:14px;font-weight:600}
.sm:hover{background:rgba(255,255,255,.1)}
.sm.g{color:var(--green);border-color:var(--green-line);background:var(--green-bg)}
.sm.r{color:var(--red);border-color:rgba(255,122,122,.35)}
.sm[disabled]{opacity:.5;cursor:default}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.seg .sm{text-align:center}
.seg .sm.on{color:var(--green-ink);background:var(--green);border-color:var(--green)}
.seg.two{grid-template-columns:repeat(2,1fr);margin-top:0}
.empty{padding:30px 22px;text-align:center;color:var(--mute)}

.acct{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--green-bg);border:1px solid var(--green-line);color:var(--green);font-weight:700;font-size:22px}
.acct b{display:block;font-size:19px;overflow-wrap:anywhere}
.acct span{color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 12px}
.row2 span{font-size:17px}
.note{color:var(--mute);font-size:14px;margin-top:12px}

/* login */
.login{min-height:86svh;display:flex;flex-direction:column;justify-content:center;gap:0;padding-block:20px}
.lang{display:flex;justify-content:flex-end;gap:6px;padding-top:8px}
.lang button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-size:13px;font-weight:600}
.lang button.on{color:var(--green);border-color:var(--green-line);background:var(--green-bg)}
.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:var(--green-bg);border:1px solid var(--green-line);color:var(--green);margin-bottom:22px}
.logo svg{width:36px;height:36px}
.login .sub{margin-bottom:34px}
.btn-g,.btn-guest{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:58px;border-radius:999px;font-weight:600;font-size:18px}
.btn-g{background:#fff;color:#1f1f1f;box-shadow:0 6px 28px rgba(255,255,255,.08)}
.btn-g svg{width:22px;height:22px}
.btn-guest{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink)}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:14px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.fine{color:var(--mute);font-size:13px;text-align:center;margin-top:18px;text-wrap:balance}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.panel{position:relative;width:min(100%,460px);max-height:88svh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:22px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.panel h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.panel p{color:var(--mute);font-size:15px;margin-top:10px}
.panel .ex{color:var(--green);font-variant-numeric:tabular-nums}
.panel label{display:block;color:var(--mute);font-size:14px;font-weight:500;margin:16px 2px 8px}
.panel input[type=text],.panel input[type=email]{width:100%;height:50px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);padding:0 16px;font-size:18px;outline:0}
.panel input:focus{border-color:var(--green-line);box-shadow:0 0 0 3px var(--green-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:15px;font-weight:600;color:var(--mute)}
.chip.on{color:var(--green);border-color:var(--green-line);background:var(--green-bg)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px!important}
.brow{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.btn{flex:1;min-width:96px;height:50px;border-radius:999px;font-weight:700;font-size:17px;text-align:center;border:1px solid var(--line);background:rgba(255,255,255,.07)}
.btn.solid{background:linear-gradient(180deg,#68ec9a,#3fcf78);color:var(--green-ink);border-color:transparent}
.btn.danger{color:var(--red);border-color:rgba(255,122,122,.35)}

.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(380px,calc(100% - 32px));background:#16201a;border:1px solid var(--green-line);color:var(--ink);padding:12px 18px;border-radius:999px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.panel input[type=password]{width:100%;height:50px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);padding:0 16px;font-size:18px;outline:0;color:inherit}
.lnk{color:var(--green);text-decoration:underline;font:inherit}
.brand{display:flex;align-items:center;gap:12px}.brand svg{width:46px;height:46px;flex:none}
.logo{background:none;border:0;width:92px;height:92px}.logo svg{width:92px;height:92px}
.books{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.book{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px 14px;border-radius:22px;background:rgba(255,255,255,.055);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:16px;text-align:center;transition:transform .15s,background .15s}
.book:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.book small{color:var(--green);font-size:13px;font-weight:600}
.bk{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:21px;letter-spacing:-.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px rgba(0,0,0,.45)}
@media(min-width:900px){
.app{max-width:1000px;padding-left:130px}
.app.auth{max-width:430px;padding-left:0}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.app>.card{max-width:720px}
.books{grid-template-columns:repeat(4,1fr)}
.tabs{top:50%;bottom:auto;right:auto;transform:translateY(-50%);padding:0 0 0 24px}
.tabs-in{grid-template-columns:1fr;width:100px;max-width:none;margin:0}
}
/* liquid glass */
.card,.tabs-in,.panel,.round,.leg,.field,.book,.sm,.btn,.chip,.toast{-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%)}
.card,.tabs-in,.panel{box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.3),inset -1px -1px 0 rgba(255,255,255,.07),inset 0 0 28px rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.4)}
.card::before,.tabs-in::before,.panel::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.2),rgba(255,255,255,0) 28%,rgba(255,255,255,0) 72%,rgba(255,255,255,.08))}
.panel{background:rgba(22,28,25,.62)}
.leg,.field,.book{box-shadow:inset 1px 1px 0 rgba(255,255,255,.18),inset -1px -1px 0 rgba(255,255,255,.04)}
/* fluid motion */
.leg,.book,.sm,.btn,.tab,.cta,.add,.chip,.round{transition:transform .38s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s}
.leg:active,.book:active,.sm:active,.btn:active,.tab:active,.cta:active,.add:active,.chip:active,.round:active{transform:scale(.95)}
.bg i{animation:drift 24s ease-in-out infinite alternate}.b2{animation-duration:30s!important;animation-delay:-9s}.b3{animation-duration:27s!important;animation-delay:-4s}
@keyframes drift{to{translate:26px -34px}}
.tabs-in{position:relative}
.ind{position:absolute;top:8px;bottom:8px;left:8px;width:calc((100% - 28px)/4);border-radius:24px;background:linear-gradient(180deg,rgba(92,226,143,.3),rgba(92,226,143,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 20px rgba(92,226,143,.25);transform:translateX(calc(var(--i,0)*(100% + 4px)));transition:transform .6s cubic-bezier(.34,1.45,.5,1)}
.tab{position:relative;z-index:1}.tab.on{background:none}
.panel{animation:sheetUp .5s cubic-bezier(.2,.9,.25,1.08)}.scrim{animation:fadeIn .3s}
@keyframes sheetUp{from{transform:translateY(60px) scale(.96);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
.toast{transition:opacity .25s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.tabs{view-transition-name:tabs}.bg{view-transition-name:bg}
::view-transition-group(tabs),::view-transition-group(bg){animation:none}
::view-transition-old(tabs),::view-transition-old(bg){display:none}
::view-transition-new(tabs),::view-transition-new(bg){animation:none}
::view-transition-old(root){animation:.18s ease both vout}
::view-transition-new(root){animation:.42s cubic-bezier(.2,.9,.25,1) both vin}
@keyframes vout{to{opacity:0;filter:blur(6px)}}
@keyframes vin{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(8px)}}
@media(min-width:900px){.ind{left:8px;right:8px;width:auto;bottom:auto;height:calc((100% - 28px)/4);transform:translateY(calc(var(--i,0)*(100% + 4px)))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function parse(s){try{return s?JSON.parse(s):null}catch(e){return null}}
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():"00000000-0000-4000-8000-"+Math.random().toString(16).slice(2,14).padEnd(12,"0")}

function amToDec(a){return a>0?1+a/100:1+100/Math.abs(a)}
function decToAm(d){return d>=2?Math.round((d-1)*100):Math.round(-100/(d-1))}
function parseOdds(str){
  var s=String(str).trim().replace(",",".");
  if(!s)return null;
  if(s.indexOf(".")>-1){var d=parseFloat(s);return isFinite(d)&&d>1&&d<1000?d:null}
  if(!/^[+-]?\d+$/.test(s))return null;
  var n=parseInt(s,10);
  if(Math.abs(n)<100||Math.abs(n)>100000)return null;
  return amToDec(n);
}
function money(n){return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function combined(legs){return legs.reduce(function(a,l){return a*l.dec},1)}

function defaultData(){
  return {stake:100,fmt:"american",history:[],bets:[],legs:[
    {id:uid(),sport:"NFL",pick:"Ravens -3.5",dec:amToDec(-110)},
    {id:uid(),sport:"NBA",pick:"Lakers ML",dec:amToDec(140)},
    {id:uid(),sport:"NHL",pick:"Over 5.5",dec:amToDec(-120)}]};
}
function normalize(d){
  d=d||defaultData();
  if(!Array.isArray(d.legs))d.legs=[];
  if(!Array.isArray(d.history))d.history=[];
  if(!Array.isArray(d.bets))d.bets=[];
  if(typeof d.stake!=="number"||!isFinite(d.stake))d.stake=100;
  if(d.fmt!=="decimal")d.fmt="american";
  return d;
}
function userKey(){return session&&session.type!=="guest"?"parlaylab:data:g:"+session.email.toLowerCase():"parlaylab:data:guest"}
function loadData(){data=normalize(parse(lsGet(userKey())))}
function save(){lsSet(userKey(),JSON.stringify(data))}
function fmtOdds(d){
  if(data.fmt==="decimal")return d.toFixed(2);
  var a=decToAm(d);return (a>0?"+":"")+a;
}
function nameFrom(email){
  var l=email.split("@")[0].replace(/[._-]+/g," ").trim();
  return l.replace(/\b\w/g,function(c){return c.toUpperCase()})||email;
}

function updateResults(){
  if(!$("#r-odds"))return;
  var has=data.legs.length>0, dec=combined(data.legs), pay=data.stake*dec;
  $("#r-odds").textContent=has?fmtOdds(dec):"—";
  $("#r-pay").textContent=has?money(pay):"$0.00";
  $("#r-profit").textContent=has?money(Math.max(pay-data.stake,0)):"$0.00";
}

function betsView(){
  var risk=0,net=0;
  data.bets.forEach(function(b){
    if(b.status==="pending")risk+=b.stake;
    else if(b.status==="won")net+=b.stake*(b.dec-1);
    else if(b.status==="lost")net-=b.stake;
  });
  var out=head(t("tBets"),t("betsSub"),false)+booksCard()+
   '<section class="card"><div class="stats"><div class="stat"><span>'+t("tracked")+'</span><b>'+data.bets.length+'</b></div><div class="stat"><span>'+t("atRisk")+'</span><b>'+money(risk)+'</b></div><div class="stat"><span>'+t("net")+'</span><b class="'+(net>0?"pos":net<0?"neg":"")+'">'+(net<0?"-":"")+money(Math.abs(net))+'</b></div></div></section>';
  if(!data.bets.length)return out+'<section class="card empty">'+t("noBets")+'<div class="acts" style="justify-content:center"><button class="sm g" data-act="tab" data-v="calc">'+t("goCalc")+'</button></div></section>';

    out+='<section class="card item"><div class="item-h"><b>'+t("parlayN")(b.legs.length)+'</b><span class="o">'+fmtOdds(b.dec)+'</span></div><div class="item-d">'+dateStr(b.t)+'</div>'+legList(b.legs)+
    '<div class="money"><span>'+t("stakeWord")+' <b>'+money(b.stake)+'</b></span><span>'+t("payoutWord")+' <b>'+money(b.stake*b.dec)+'</b></span></div>'+

    '<div class="acts"><button class="sm r" data-act="delbet" data-id="'+b.id+'">'+t("remove")+'</button></div></section>';
  });
  return out;
}

     if(!clearArmed){clearArmed=true;render(true);setTimeout(function(){if(clearArmed){clearArmed=false;if(session&&tab==="settings")render(true)}},4000)}
     else{clearArmed=false;if(sb&&session.type!=="guest")sb.from("parlays").delete().neq("id","00000000-0000-0000-0000-000000000000").then(function(){});data.history=[];data.bets=[];save();render(true);toast(t("cleared"))}
     break;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="lo"){var d0=parseOdds(e.target.value),pv=$("#oprev");if(pv)pv.textContent=d0?t("oddsPrev")(d0):"";return}
  if(e.target.id!=="stake")return;
  var v=parseFloat(e.target.value.replace(/[^0-9.,]/g,"").replace(",","."));
  data.stake=isFinite(v)?Math.min(v,1e9):0;
  save();updateResults();
});
document.addEventListener("focusin",function(e){if(e.target.id==="stake")setTimeout(function(){try{e.target.select()}catch(x){}},0)});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();
  if(e.key==="Enter"&&!$("#sheet").hidden&&e.target.tagName==="INPUT"){
    var b=$("#sheet").querySelector('[data-act="saveleg"],[data-act="gsubmit"],[data-act="esubmit"],[data-act="newpass"]');if(b)b.click();
  }
});

/* ---------- boot ---------- */
if(session&&session.type!=="guest"&&session.email)loadData();else session=null;
if(sb)sb.auth.onAuthStateChange(authHandler);
render();
})();
</script>
